{% load jalali_filters %}
<style>
    .wl-page { max-width: 1350px; margin: 0 auto; }
    .wl-hero {
        display: flex; align-items: flex-start; justify-content: space-between;
        gap: 1rem; flex-wrap: wrap; margin-bottom: 1.1rem;
    }
    .wl-hero h1 {
        font-size: 1.4rem; font-weight: 800; margin: 0 0 .35rem;
        color: var(--text-primary);
    }
    .wl-hero p { margin: 0; color: var(--text-secondary); font-size: .86rem; }
    .wl-actions { display: flex; gap: .5rem; flex-wrap: wrap; }

    .wl-panel {
        background: var(--glass); border: 1px solid var(--glass-border);
        border-radius: 18px; padding: .85rem 1rem;
        display: flex; align-items: center; justify-content: space-between;
        gap: 1rem; flex-wrap: wrap; margin-bottom: 1rem;
        backdrop-filter: blur(18px);
    }
    .wl-month-form { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; }
    .wl-month-form label { color: var(--text-secondary); font-size: .8rem; margin: 0; }
    .wl-month-form select {
        background: var(--form-bg); color: var(--text-primary);
        border: 1px solid var(--glass-border); border-radius: 10px;
        padding: .42rem .7rem; font-size: .82rem; font-family: inherit;
    }
    .wl-month-form select:focus { outline: none; border-color: var(--primary); }

    .wl-status {
        display: inline-flex; align-items: center; gap: .35rem;
        padding: .38rem .9rem; border-radius: 999px;
        font-size: .78rem; font-weight: 800; white-space: nowrap;
    }
    .wl-status.draft { background: rgba(245,158,11,.14); color: #f59e0b; }
    .wl-status.submitted { background: rgba(16,185,129,.14); color: #10b981; }
    .wl-status.none { background: rgba(148,163,184,.14); color: var(--text-secondary); }

    .wl-stats {
        display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
        gap: .7rem; margin-bottom: 1rem;
    }
    .wl-stat {
        background: var(--glass); border: 1px solid var(--glass-border);
        border-radius: 16px; padding: .8rem 1rem;
        display: flex; flex-direction: column; gap: .2rem;
        backdrop-filter: blur(18px);
    }
    .wl-stat span { color: var(--text-secondary); font-size: .78rem; }
    .wl-stat strong {
        font-size: 1.35rem; font-weight: 800; color: var(--text-primary);
        font-variant-numeric: tabular-nums;
    }
    .wl-stat.danger strong { color: var(--danger); }

    .wl-table-wrap {
        overflow: auto; border: 1px solid var(--glass-border);
        border-radius: 16px; background: var(--glass);
        backdrop-filter: blur(18px);
    }
    .wl-table {
        width: 100%; border-collapse: separate; border-spacing: 0;
        min-width: 720px; margin: 0;
    }
    .wl-table th, .wl-table td {
        padding: 10px 8px; text-align: center;
        border-bottom: 1px solid var(--glass-border);
        font-size: .82rem; vertical-align: middle;
        color: var(--text-primary);
    }
    .wl-table thead th {
        background: var(--bg-card-solid); color: var(--text-secondary);
        font-weight: 800; position: sticky; top: 0; z-index: 2;
    }
    .wl-table tbody tr:hover td { background: rgba(var(--primary-rgb), .06); }
    .wl-table .wl-title-col {
        text-align: right; font-weight: 700; white-space: nowrap;
        padding-right: 12px;
    }
    .wl-table .wl-num { font-variant-numeric: tabular-nums; }
    .wl-table .wl-actions-cell { white-space: nowrap; }
    .wl-table .wl-actions-cell a,
    .wl-table .wl-actions-cell button { margin: 0 2px; }

    .wl-empty {
        background: var(--glass); border: 1px dashed var(--glass-border);
        border-radius: 16px; padding: 1.2rem; text-align: center;
        color: var(--text-secondary); font-size: .9rem;
    }
    .wl-empty a { color: var(--primary); }

    .wl-form-card {
        background: var(--glass); border: 1px solid var(--glass-border);
        border-radius: 18px; padding: 1.2rem 1.4rem;
        backdrop-filter: blur(18px); max-width: 720px;
    }
    .wl-form-card .form-label { font-weight: 700; font-size: .84rem; }
    .wl-form-card .form-control {
        background: var(--form-bg); color: var(--text-primary);
        border: 1px solid var(--glass-border); border-radius: 10px;
    }
    .wl-form-card .form-control:focus {
        background: var(--form-bg); color: var(--text-primary);
        border-color: var(--primary); box-shadow: 0 0 0 3px rgba(var(--primary-rgb), .18);
    }
    .wl-form-actions { display: flex; gap: .6rem; flex-wrap: wrap; margin-top: 1.2rem; }

    @media (max-width: 768px) {
        .wl-hero h1 { font-size: 1.2rem; }
    }
</style>
<style>
    /* ---------- ماتریس پروژه × روز ---------- */
    .wl-matrix { min-width: 1120px; }
    .wl-matrix th, .wl-matrix td { padding: 6px 3px; font-size: .76rem; }
    .wl-matrix thead th {
        background: var(--bg-card-solid); color: var(--text-secondary);
        font-weight: 800; padding: 8px 3px;
    }
    .wl-matrix .wl-title-col {
        position: sticky; right: 0; z-index: 2;
        background: var(--bg-card-solid);
        text-align: right; padding-right: 12px; padding-left: 8px;
        min-width: 150px; max-width: 200px;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        box-shadow: -1px 0 0 var(--glass-border);
    }
    .wl-matrix thead .wl-title-col { z-index: 4; }
    .wl-matrix .wl-day { display: block; font-weight: 800; color: var(--text-primary); }
    .wl-matrix .wl-weekday { display: block; font-size: .62rem; color: var(--text-muted); margin-top: 1px; }
    .wl-matrix th.is-friday .wl-day,
    .wl-matrix th.is-friday .wl-weekday { color: var(--danger); }
    .wl-input {
        width: 50px; padding: 4px 2px; text-align: center;
        border: 1px solid var(--glass-border); border-radius: 8px;
        background: var(--form-bg); color: var(--text-primary);
        font-size: .76rem; font-family: inherit;
        -moz-appearance: textfield;
    }
    .wl-input::-webkit-outer-spin-button,
    .wl-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    .wl-input:focus {
        outline: none; border-color: var(--primary);
        box-shadow: 0 0 0 2px rgba(var(--primary-rgb), .2);
    }
    .wl-other-title {
        width: 100%; min-width: 130px;
        padding: 4px 6px; border-radius: 8px;
        border: 1px dashed var(--glass-border);
        background: var(--form-bg); color: var(--text-primary);
        font-size: .74rem; font-family: inherit;
    }
    .wl-val { color: var(--text-primary); font-size: .78rem; }
    .wl-row-total { font-weight: 800; color: var(--text-primary); white-space: nowrap; }
    .wl-matrix .wl-worked-row td { background: rgba(148,163,184,.08); font-weight: 700; }
    .wl-matrix .wl-alloc-row td { font-weight: 800; color: var(--text-primary); }
    .wl-matrix .wl-remain-row td { color: var(--success); font-weight: 700; }
    .wl-matrix .wl-alloc-row td.over,
    .wl-matrix .wl-remain-row td.over {
        color: var(--danger) !important; background: rgba(239,68,68,.12);
    }
    @media (max-width: 768px) {
        .wl-matrix { min-width: 980px; }
        .wl-matrix .wl-title-col { min-width: 120px; max-width: 140px; }
    }
</style>
<style>
    .wl-matrix .wl-errand-row td { background: rgba(245,158,11,.12); font-weight: 700; }
    .wl-matrix .wl-errand-row .wl-title-col { background: var(--bg-card-solid); }
    .wl-auto-badge {
        display: inline-block; margin-right: 6px; padding: 1px 7px;
        border-radius: 999px; background: rgba(245,158,11,.22);
        color: #b45309; font-size: .6rem; font-weight: 800;
    }
    .wl-matrix .wl-allocatable-row td {
        background: rgba(148,163,184,.07);
        color: var(--text-secondary); font-weight: 700;
    }
    .wl-matrix .wl-total-row td {
        background: rgba(var(--primary-rgb), .08);
        font-weight: 800; color: var(--text-primary);
    }
</style>
<style>
    /* ---------- نمای موبایل: کارت‌های روزانه ---------- */
    .wl-m-other {
        display: flex; align-items: center; gap: .6rem; flex-wrap: wrap;
        background: var(--glass); border: 1px solid var(--glass-border);
        border-radius: 14px; padding: .7rem .9rem; margin-bottom: .8rem;
        backdrop-filter: blur(18px);
    }
    .wl-m-other label { margin: 0; font-size: .8rem; color: var(--text-secondary); }
    .wl-m-other .wl-other-title { flex: 1; min-width: 160px; }
    .wl-m-other-readonly {
        font-size: .82rem; color: var(--text-secondary);
        background: var(--glass); border: 1px solid var(--glass-border);
        border-radius: 12px; padding: .6rem .85rem; margin-bottom: .8rem;
    }
    .wl-m-card {
        background: var(--glass); border: 1px solid var(--glass-border);
        border-radius: 16px; padding: .75rem .9rem; margin-bottom: .75rem;
        backdrop-filter: blur(18px);
    }
    .wl-m-head {
        display: flex; justify-content: space-between; align-items: center;
        gap: .5rem; flex-wrap: wrap; margin-bottom: .45rem;
    }
    .wl-m-day strong { font-size: .95rem; color: var(--text-primary); }
    .wl-m-day span { color: var(--text-muted); font-size: .72rem; margin-right: 6px; }
    .wl-m-badges { display: flex; gap: .4rem; flex-wrap: wrap; font-size: .72rem; }
    .wl-m-badges span {
        background: rgba(var(--primary-rgb), .1); color: var(--text-secondary);
        border-radius: 999px; padding: 2px 9px;
    }
    .wl-m-projects { display: flex; flex-direction: column; }
    .wl-m-project {
        display: flex; flex-direction: column; align-items: stretch;
        gap: .3rem; padding: .45rem 0;
        border-bottom: 1px dashed var(--glass-border);
    }
    .wl-m-project-main {
        display: flex; align-items: center; justify-content: space-between;
        gap: .75rem;
    }
    .wl-m-project:last-child { border-bottom: 0; }
    .wl-m-project label {
        margin: 0; font-size: .83rem; color: var(--text-primary);
        flex: 1; min-width: 0; overflow-wrap: anywhere;
    }
    .wl-m-project .wl-input { width: 84px; padding: 6px 4px; font-size: .82rem; }
    .wl-input.is-locked, .wl-note-input.is-locked {
        border-color: transparent !important;
        background: transparent !important;
        box-shadow: none !important;
        cursor: default;
    }
    .wl-input.is-locked { padding-inline: 2px; }
    .wl-note-input.is-locked { padding-inline: 1px; }
    .wl-note-input.is-locked::placeholder { color: transparent; }
    .wl-m-project-controls {
        display: flex; align-items: center; gap: .3rem;
        flex-shrink: 0;
    }
    .wl-row-action {
        width: 28px; height: 28px; padding: 0;
        display: inline-grid; place-items: center;
        border-radius: 8px; cursor: pointer;
        border: 1px solid var(--glass-border);
        background: var(--glass); color: var(--text-secondary);
        font-size: .68rem;
        transition: transform .2s, color .2s, border-color .2s, background .2s;
    }
    .wl-row-action:hover {
        transform: translateY(-1px);
        color: var(--primary); border-color: var(--primary);
        background: rgba(var(--primary-rgb), .1);
    }
    .wl-row-action.danger:hover {
        color: var(--danger); border-color: var(--danger);
        background: rgba(239,68,68,.1);
    }
    .wl-m-project.is-cleared { opacity: .55; }
    .wl-note-input {
        width: 100%; padding: .38rem .55rem;
        font-size: .72rem; font-family: inherit;
        color: var(--text-primary); background: var(--form-bg);
        border: 1px dashed var(--glass-border); border-radius: 8px;
    }
    .wl-note-input::placeholder { color: var(--text-muted); }
    .wl-note-input:focus {
        outline: none; border-color: var(--primary);
        box-shadow: 0 0 0 2px rgba(var(--primary-rgb), .12);
    }
    .wl-note-text {
        font-size: .72rem; color: var(--text-secondary);
        line-height: 1.7; padding: .1rem .1rem 0;
    }
    .wl-m-company-row {
        flex-direction: row; align-items: center; justify-content: space-between;
        color: #b45309; font-weight: 700;
        background: rgba(245,158,11,.1); border-radius: 10px;
        padding: .5rem .55rem; margin-top: .3rem; border-bottom: 0;
    }
    .wl-m-foot {
        display: flex; justify-content: space-between; gap: .5rem;
        flex-wrap: wrap; margin-top: .55rem;
        font-size: .78rem; color: var(--text-secondary);
    }
    .wl-m-foot strong {
        color: var(--text-primary); font-size: .86rem;
        font-variant-numeric: tabular-nums;
    }
    .wl-m-foot strong.over { color: var(--danger); }
    .wl-m-add {
        display: flex; align-items: center; flex-wrap: wrap; gap: .4rem;
        margin-top: .55rem; padding-top: .55rem;
        border-top: 1px dashed var(--glass-border);
    }
    .wl-m-add-select {
        flex: 1 1 150px; min-width: 0;
        background: var(--form-bg); color: var(--text-primary);
        border: 1px dashed var(--glass-border); border-radius: 10px;
        padding: .45rem .55rem; font-size: .8rem; font-family: inherit;
    }
    .wl-m-add-select:focus { outline: none; border-color: var(--primary); }
    .wl-m-add-note {
        flex: 2 1 180px; min-width: 0;
        padding: .42rem .55rem;
        background: var(--form-bg); color: var(--text-primary);
        border: 1px solid var(--glass-border); border-radius: 10px;
        font-size: .76rem; font-family: inherit;
    }
    .wl-m-add-note::placeholder { color: var(--text-muted); }
    .wl-m-add-note:focus { outline: none; border-color: var(--primary); }
    .wl-m-add-hours {
        width: 62px; padding: .42rem .35rem; text-align: center;
        background: var(--form-bg); color: var(--text-primary);
        border: 1px solid var(--glass-border); border-radius: 10px;
        font-size: .8rem; font-family: inherit;
        -moz-appearance: textfield;
    }
    .wl-m-add-hours::-webkit-outer-spin-button,
    .wl-m-add-hours::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    .wl-m-add-hours:focus { outline: none; border-color: var(--primary); }
    .wl-m-add-btn {
        padding: .42rem .7rem; border-radius: 10px; cursor: pointer;
        border: 1px solid rgba(var(--primary-rgb), .35);
        background: rgba(var(--primary-rgb), .12);
        color: var(--primary); font-size: .78rem; font-weight: 700;
        font-family: inherit; white-space: nowrap;
    }
    .wl-m-add-btn:hover { background: rgba(var(--primary-rgb), .2); }
    @media (max-width: 768px) {
        .wl-actions { width: 100%; }
        .wl-actions .btn { flex: 1; justify-content: center; }
    }
</style>
<style>
    /* ---------- ردیف‌های جمع پایین ماتریس: همیشه قابل مشاهده ---------- */
    .wl-matrix tfoot tr { height: 32px; }
    .wl-matrix tfoot td {
        position: sticky;
        z-index: 5;
        height: 32px;
        padding-top: 0;
        padding-bottom: 0;
        background: var(--bg-card-solid);
        box-shadow: inset 0 1px 0 var(--glass-border);
    }
    .wl-matrix tfoot .wl-title-col { z-index: 7; }
    .wl-matrix tfoot tr:nth-child(1) td { bottom: 64px; }
    .wl-matrix tfoot tr:nth-child(2) td { bottom: 32px; }
    .wl-matrix tfoot tr:nth-child(3) td { bottom: 0; }
    .wl-matrix tfoot .wl-worked-row td {
        background:
            linear-gradient(rgba(148,163,184,.1), rgba(148,163,184,.1)),
            var(--bg-card-solid);
    }
    .wl-matrix tfoot .wl-total-row td {
        background:
            linear-gradient(rgba(var(--primary-rgb),.12), rgba(var(--primary-rgb),.12)),
            var(--bg-card-solid);
    }
    .wl-matrix tfoot .wl-remain-row td {
        background: var(--bg-card-solid);
    }
    .wl-matrix tfoot .wl-remain-row td.over {
        background:
            linear-gradient(rgba(239,68,68,.14), rgba(239,68,68,.14)),
            var(--bg-card-solid);
    }
</style>
