{% extends 'base/base.html' %}
{% load static %}
{% load crispy_forms_tags %}

{% block title %}تغییر رمز عبور{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card-modern card">
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <div class="icon-circle" style="background:rgba(245,158,11,0.15);color:var(--warning);width:70px;height:70px;font-size:1.8rem;margin:0 auto;">
                        <i class="fas fa-key"></i>
                    </div>
                    <h3 class="mt-3" style="font-weight:700">تغییر رمز عبور</h3>
                </div>
                <form method="POST">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-gradient btn-lg">تغییر رمز عبور</button>
                        <a href="{% url 'dashboard' %}" class="btn btn-outline-glass">بازگشت</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
